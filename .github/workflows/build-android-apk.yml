name: Android APK

# Builds the Android APK on a Windows runner, the platform the Android scripts
# in os/android/scripts were written and tested on (Git Bash + the NDK).
# Download the result from the run's "Artifacts" section.
#
# Starts by itself on a push to the mali-dimensity-8400 branch, or by hand from
# the Actions tab. The native build is very large: the first run takes hours,
# and later runs are faster because the build folder is cached.

on:
  push:
    branches: [mali-dimensity-8400, main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      gpu:
        description: 'GPU family the APK defaults to'
        type: choice
        options: [mali]
        default: mali

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (${{ inputs.gpu || 'mali' }})
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      LIBERTY_GPU: ${{ inputs.gpu || 'mali' }}
      NDK_VER: 29.0.14206865
      STRIP: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Allow long paths
        run: git config --system core.longpaths true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake and Ninja
        run: python -m pip install 'cmake>=3.29,<5' ninja

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform and NDK r29
        run: |
          SDKMANAGER="$(cygpath -u "$ANDROID_HOME")/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;$NDK_VER" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/build
            out/host-tools
          key: android-${{ env.LIBERTY_GPU }}-${{ github.sha }}
          restore-keys: |
            android-${{ env.LIBERTY_GPU }}-
            android-

      - name: Fetch pinned dependencies and apply patches
        run: python tools/setup_repo.py

      - name: Build the Vulkan driver proxy
        run: |
          export ANDROID_HOME="$(cygpath -u "$ANDROID_HOME")"
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          bash os/android/scripts/build_driver_proxy.sh

      # The slow step. Its own timeout leaves time for the cache save below,
      # so a build that runs out of time keeps its progress for the next run.
      - name: Build the native libraries
        timeout-minutes: 320
        run: |
          export ANDROID_HOME="$(cygpath -u "$ANDROID_HOME")"
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          bash os/android/scripts/build_native.sh

      - name: Save build cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/build
            out/host-tools
          key: android-${{ env.LIBERTY_GPU }}-${{ github.sha }}

      - name: Package the APK
        run: |
          export ANDROID_HOME="$(cygpath -u "$ANDROID_HOME")"
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          rm -f os/android/app/build/outputs/apk/release/app-release.apk
          bash os/android/scripts/build_apk.sh release

      - name: Name the APK
        run: |
          VERSION="$(grep -o 'versionName *= *"[^"]*"' os/android/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')"
          [ "$LIBERTY_GPU" = "mali" ] && VERSION="$VERSION-mali"
          cp os/android/app/build/outputs/apk/release/app-release.apk "Liberty360-$VERSION.apk"
          echo "APK_NAME=Liberty360-$VERSION.apk" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          ls -la Liberty360-*.apk

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/mali-dimensity-8400' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.RELEASE_TAG }}
          name: Liberty360 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.RELEASE_TAG }}
          body: |
            Automated release build of Liberty360 for ARM Mali GPUs.
            - **Target**: MediaTek Dimensity 9000 (Mali-G710)
            - **Vulkan Backend**: System Vulkan driver with Xenos GPU backend
            - **Package**: `${{ env.APK_NAME }}`
          files: ${{ env.APK_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
